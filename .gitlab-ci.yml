# GitLab CI for robotstxtr: fleet-ci's template, pinned by commit SHA (seor
# ADR 0012, fleet-ci README "The CI template"). The template owns the event
# table, the jobs and the images; this file sets only the package's switches
# and settings. A push to main or a branch, and a merge request, create no
# pipeline: the merge gate is the local one (.fleet-ci/gate, run by the
# .fleet-ci/pre-push hook; settings in .fleet-ci.yml). T2 runs on the
# deep-check schedule (SCHEDULE_KIND=deep-check, schedule 4472810), T3 on a
# RELEASE=1 web pipeline and a v* tag. The dependency-audit schedule
# (4467473) gets no pipeline: osv-audit and security-audit run in T2.
# design/ci.md says what moved where.
#
# Every switch keeps the template's default. robotstxtr has compiled code
# (the vendored Google, Bing and Yandex matchers and its cpp11 bindings), so
# t2-sanitizers runs R-hub's clang-asan container, an amd64 image, under
# emulation on the arm64 runner; t2-locale builds .fleet-ci.yml's case-folding
# locales and runs scripts/check-locale-legs.R after its leg.
#
# Bump the pin by changing `ref:` and re-running fleet-ci's bin/vendor at the
# same SHA, in one merge request: .fleet-ci/VERSION must equal `ref:`.
include:
  - project: bart-turczynski/fleet-ci
    ref: 864e5386511de38b0dff594ba3118a800f662cc7
    file: templates/r-package.yml

variables:
  # The declared floor, `Depends: R (>= 4.1.0)`: 4.1 is the oldest minor with
  # an arm64 rocker/r-ver image, which the runner needs. The snapshot must
  # serve `Imports: rurl (>= 3.0.1)` (on CRAN 2026-09-09) and the punycoder,
  # pslr and raddr releases rurl needs, so it is fleet-ci's own p3m date. Its
  # Ubuntu 20.04 binary path spares source builds on rocker/r-ver:4.1.3,
  # whose image has no libcurl headers. Unproven until the first T2 run:
  # design/ci.md, "Gaps accepted".
  FLEET_FLOOR_R: "4.1.3"
  FLEET_FLOOR_SNAPSHOT: "https://packagemanager.posit.co/cran/__linux__/focal/2026-10-28"
