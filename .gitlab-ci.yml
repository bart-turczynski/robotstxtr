# Fast verification gate: lint + a single Ubuntu --as-cran R CMD check +
# coverage (failing below 95%) + README-sync + generated-docs-sync + the two
# vendored-tree fidelity checks, on every push to main (and on tag pipelines).
# Merge-request and feature-branch pipelines are suppressed fleet-wide
# (SEOR-bmgkzhvy) -- see the `workflow:` block below -- so this no longer runs
# "on every merge request".
#
# The R-version legs (release, oldrel, devel), the leg at the declared R floor
# and the ASAN/UBSAN sanitizer leg run only on the weekly pipeline schedule
# that sets SCHEDULE_KIND=deep-check, and the dependency audits only on the one
# that sets SCHEDULE_KIND=dependency-audit (seor design/fleet-standard.md,
# design/fleet.md). Each such job requires `$CI_PIPELINE_SOURCE == "schedule"`
# AND its own SCHEDULE_KIND, so one schedule cannot fire the other's jobs. A
# hand-started `web` pipeline offers them as manual, non-blocking jobs.
#
# Ported from .github/workflows/verify.yml (ROBO-tkmclvsg). GitLab is the
# forge; the GitHub repository is a read-only mirror and runs no CI.
#
# DEPENDENCY RESOLUTION. When this gate was written `rurl (>= 2.2.1)` was not on
# CRAN -- CRAN served 1.2.0 -- and the R-universe staging repo that used to cover
# the gap is gone with the GitHub account that hosted its registry. So rurl is
# installed straight from its GitLab git URL. Its own imports (stringi,
# punycoder >= 1.2.0, pslr >= 1.1.0) are all satisfied by current CRAN, so rurl
# is the ONLY git dependency.
#
# `RURL_GIT` is PINNED to the `v3.0.1` tag (commit 0ca8f09). It used to track
# rurl's default branch, which made every run here test rurl's development head
# -- pipeline 2838356532 installed `rurl 3.0.1.9000` -- so a rurl commit could
# turn this pipeline red on a robotstxtr tree nobody touched, and CI was not
# exercising what a user would install. Move the pin deliberately when
# robotstxtr is ready for a newer rurl; do not drop it back to the branch
# (ROBO-hzcnolhe).
#
# The pin stays on git rather than resolving rurl from the repos configured
# below, because the git tag is the one coordinate this file fixes itself. CRAN
# published rurl 3.0.1 on 2026-09-09 and its p3m mirror -- which `.r-binaries`
# puts FIRST -- still served 1.2.0 more than a day later, so repo resolution was
# not a reliable substitute at the moment the pin was made.

# One pipeline per merge, not three (SEOR-bmgkzhvy). These are NOT GitLab.com
# shared runners and concurrency is NOT capped at 1 -- both were previously
# claimed here and are false (SEOR-gpafxhua). The truth, verified 2026-09-23:
# self-hosted Docker runners on one Mac, registered from
# ~/.gitlab-runner/config.toml, with `concurrent = 4` -- a number this fleet
# owns, not a platform limit. Full detail in
# seor/design/adr/0003-fleet-ci-runs-on-self-hosted-runners.md. That does not
# make duplicate pipelines free: a branch pipeline and its merge-request
# pipeline still test the same tree the `main` pipeline is about to test again
# a few minutes later, competing for the same laptop's four slots and its
# compute budget -- and the two useless ones are CREATED FIRST, so they
# contend with the pipeline that actually gates the work (main). Measured
# repeatedly: a deleted branch's pipeline dies at get_sources (exit 128) or
# worse, runs to completion against a tree nobody can see any more, and an
# already-merged MR's pipeline has been seen holding a runner slot for 30+
# minutes. Previously this block ran a duplicate-pipeline GUARD (suppress the
# branch pipeline only when an MR was open) plus an unconditional `web` rule;
# that guard never touched the MR pipeline, which is what actually caused the
# stalls, so it was replaced rather than kept alongside this rule set.
#
# Costs, accepted deliberately:
#   - No CI on feature-branch pushes at all. The local pre-push verify gate
#     (dev/verify.sh) is what actually blocks bad code before it leaves the
#     machine; only_allow_merge_if_pipeline_succeeds is false here, so a CI
#     result has never gated a merge in this project.
#   - No CI result visible before clicking merge (no MR pipeline).
#   - GitLab's per-line coverage annotations in an MR diff need a pipeline
#     attached to the MR; none is created now, so those annotations stop
#     appearing. The coverage badge (sourced from main) is unaffected.
#   - An API-triggered pipeline on a non-default branch falls through to
#     `when: never` and creates nothing. Hand-started `web` pipelines are the
#     exception and are listed below; `glab ci run` uses the api source, so it
#     is not a substitute for the button on a branch.
#
# The `web` rule is back, and deliberately so. It was dropped with the rest of
# the old rule set, which cost this project the escape hatch it used to unblock
# a jammed queue, and the only way left to get a server-side answer about a
# branch was to merge it first. Admitting it does not reopen the problem above:
# that was entirely push- and merge-request-driven, whereas `web` requires a
# human to open Build > Pipelines > Run pipeline and pick a ref. Started on a
# branch it runs the full gate there -- gates (lint, readme, docs, both
# vendor-fidelity legs), citation-version, check and coverage. `pages` is
# pinned to the default branch and stays unreachable, so the hatch verifies a
# branch but never publishes one (SEOR-bmgkzhvy).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never
  auto_cancel:
    on_new_commit: interruptible

default:
  # The fleet's jobs run only on the self-hosted Docker runners on the
  # maintainer's Mac, which carry this tag. Naming it makes that dependency
  # explicit: while the Mac sleeps, jobs sit pending and then fail as
  # `stuck_pending_no_matching_runners`, which is infrastructure, not code
  # (seor CONTRIBUTING.md, "Stuck-pending runbook"; SEOR-hhtzaknn).
  tags: [local-docker]
  image: rocker/r-ver:4.6.1
  interruptible: true
  cache:
    # Keyed on DESCRIPTION: any dependency change invalidates the library.
    key:
      files:
        - DESCRIPTION
    paths:
      - .r-lib/

variables:
  R_LIBS_USER: "$CI_PROJECT_DIR/.r-lib"
  R_KEEP_PKG_SOURCE: "yes"
  LINTR_ERROR_ON_LINT: "true"
  # rurl pinned to its v3.0.1 tag; see the DEPENDENCY RESOLUTION note above.
  RURL_GIT: "git::https://gitlab.com/bart-turczynski/rurl.git@v3.0.1"
  GIT_DEPTH: "1"
  # The pandoc every R job runs, installed by the `.apt-pandoc` setup below.
  # Top level rather than in a template because this file has none: the R jobs
  # share their setup through YAML anchors, so this is where every one of them
  # sees it. scripts/check-toolchain.R reads this line and fails the pre-push
  # gate when the local pandoc differs; seor's check-fleet-standard.py checks
  # it against the fleet's version (seor design/fleet-standard.md, "CI on every
  # push to `main`"; SEOR-egfbijyi). A bump moves these together, in one
  # change:
  #   - this PANDOC_VERSION;
  #   - both sha256 digests in `.apt-pandoc` (amd64, arm64), the release's own
  #     published values;
  #   - README.md, re-knit under the new pandoc.
  PANDOC_VERSION: "3.10"

stages:
  - verify
  - check
  - report
  - deploy
  - audit

# ---- shared setup ------------------------------------------------------------

# Posit Package Manager serves Linux BINARIES for CRAN packages, which is what
# keeps this pipeline inside the compute budget -- source-building httr2 and
# stringi on every job would multiply the cost. The codename is read from the
# image at runtime rather than hardcoded, so a base-image bump cannot silently
# drop us back to source installs. The HTTPUserAgent is what P3M keys the binary
# response on; without it the same URL quietly serves source tarballs.
.r-binaries: &r-binaries |
  . /etc/os-release
  mkdir -p "$R_LIBS_USER"
  cat > /tmp/ci-repos.R <<'RPROFILE'
  local({
    codename <- Sys.getenv("CI_OS_CODENAME")
    options(
      repos = c(
        P3M = sprintf(
          "https://packagemanager.posit.co/cran/__linux__/%s/latest", codename
        ),
        CRAN = "https://cloud.r-project.org"
      ),
      HTTPUserAgent = sprintf(
        "R/%s R (%s)", getRversion(),
        paste(getRversion(), R.version$platform, R.version$arch, R.version$os)
      ),
      Ncpus = max(1L, parallel::detectCores())
    )
  })
  RPROFILE
  export CI_OS_CODENAME="$VERSION_CODENAME"
  export R_PROFILE_USER=/tmp/ci-repos.R
  # Put the cached library FIRST so installs land in it. Setting R_LIBS_USER
  # (see variables: above) is NOT enough: rocker/r-ver's Renviron.site puts
  # /usr/local/lib/R/site-library FIRST in .libPaths() and R_LIBS_USER third,
  # so R installs into the image and it dies with the container -- the cache
  # then carries pak's downloads but never a built library, which is the
  # expensive half on this fleet's arm64 runners (p3m has no arm64 binaries,
  # so every dependency compiles from source). Appended to Rprofile.site
  # rather than set as an environment variable because Renviron.site is read
  # later and overrides the environment; R_LIBS_SITE does not work either, for
  # the same reason. site-library stays on the path behind it, so the image's
  # own packages (docopt, littler) remain visible. Verified against
  # rocker/r-ver:4.5.1 directly, and landed first in seor (SEOR-dyzgzyot; see
  # seor/design/adr/0003-fleet-ci-runs-on-self-hosted-runners.md for the
  # measured before/after). The print line makes each run self-evidencing.
  echo '.libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths()))' >> "${R_HOME}/etc/Rprofile.site"
  Rscript -e 'cat("Library paths:\n"); print(.libPaths())'

# pandoc is PINNED, in every R job, as the fleet standard requires (seor
# design/fleet-standard.md, "CI on every push to `main`"; SEOR-egfbijyi). Its
# markdown writer reflows text and pads tables differently between versions,
# so README.md is byte-stable only under the pandoc that knit it,
# PANDOC_VERSION above. Every R job on a push (gates, check, coverage, pages)
# and full-check and the audits take this anchor, so they all render with it.
#
# The release .deb is installed over the apt pandoc, which stays as the
# fallback; curl is installed for the download, since rocker/r-ver does not
# ship it. The two sha256 values are the release's own published digests
# (checked 2026-10-04), the same ones seor's `.r` template carries. A failed or
# mismatched download only warns and leaves the apt pandoc in place, so README
# drift `gates` reports after that warning is suspect. Nothing unverified is
# ever installed. --max-time bounds each attempt and --retry-max-time the
# retries, so a stalled CDN reaches the warning instead of hanging the job.
#
# A sequence, not one `|` scalar like the anchors above: `- *apt-pandoc` puts
# it into each job's before_script as a nested list, which GitLab flattens, so
# the checked install is a script item of its own, in seor's `.r` shape.
.apt-pandoc: &apt-pandoc
  - |
    apt-get update -qq
    apt-get install -y --no-install-recommends pandoc git ca-certificates curl
    rm -rf /var/lib/apt/lists/*
  # `apt-mark hold pandoc`, only after a successful `dpkg -i`, keeps the pin
  # through any later apt step that would replace it with apt's pandoc. A
  # failed hold only warns, so it never stops a gate (seor
  # design/fleet-standard.md; SEOR-vzupmeqj).
  - |
    ARCH=$(dpkg --print-architecture)
    case "$ARCH" in
      amd64) PANDOC_SHA256=d502599878eb29af3ae5f0cb5d559134df96534125d452c7a0674a5bad2c5ecf ;;
      arm64) PANDOC_SHA256=b651c8bfd5a0a2f6650d6c0830131747ef67a1d9c0475b1399626611419e2205 ;;
      *) PANDOC_SHA256=unknown ;;
    esac
    if curl -fsSL --retry 3 --retry-delay 5 --retry-max-time 300 --connect-timeout 20 --max-time 120 \
      -o /tmp/pandoc.deb "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-${ARCH}.deb" \
      && echo "${PANDOC_SHA256}  /tmp/pandoc.deb" | sha256sum -c - \
      && dpkg -i /tmp/pandoc.deb; then
      apt-mark hold pandoc || echo "WARNING: pandoc ${PANDOC_VERSION} installed but not held; a later apt step may replace it"
      echo "pandoc ${PANDOC_VERSION} installed"
    else
      echo "WARNING: pandoc ${PANDOC_VERSION} not installed; this job runs on the apt pandoc"
    fi
    pandoc --version | sed -n 1p

# pak from r-lib's own binary repository, not the repos above. p3m serves no
# binaries for rocker/r-ver:devel's Ubuntu (resolute), so install.packages()
# built pak from source there, its bundled curl found no libcurl headers, the
# install failed with only a warning, and the next step died on "there is no
# package called 'pak'" (pipeline 2909410786, the devel leg). The r-lib repo
# serves a self-contained build for every R version and architecture; once pak
# is in, it apt-installs the headers the rest of the source builds need
# (libcurl4-openssl-dev, libssl-dev, libicu-dev, cmake, libuv1-dev). seor,
# punycoder and sitemapr install pak the same way.
.install-pak: &install-pak |
  Rscript -e 'if (!requireNamespace("pak", quietly = TRUE)) install.packages("pak", repos = sprintf("https://r-lib.github.io/p/pak/stable/%s/%s/%s", .Platform$pkgType, R.Version()$os, R.Version()$arch))'

# ---- stage: verify -----------------------------------------------------------

# `gates` folds five formerly-separate verify-stage jobs -- lint, readme,
# docs, vendor-fidelity:yandex, vendor-fidelity:bing -- into one
# (SEOR-pgammbgo). robotstxtr measured as one of the three worst repos in the
# fleet's CI survey: ~10 jobs, ~7.5 minutes of actual compute, against a very
# large wall time driven almost entirely by ~2 minutes of pure runner-pickup
# tax PER JOB. Measured on a real main pipeline (#2875793448, all `success`):
#   lint 35.9s + readme 43.1s + docs 37.0s + vendor-fidelity:yandex 4.4s +
#   vendor-fidelity:bing 8.3s = ~128.7s combined. That is genuinely cheap;
#   five separate pickups to run ~2m9s of work was the actual waste, not the
#   work itself. `check`, `coverage`, and `pages` are deliberately left
#   separate -- different concerns, different failure meanings, and (for
#   `check`/`coverage`) genuinely not cheap.
#
# THE FOLD IS NOT FAIL-FAST. dev/gates.R runs every one of the folded gates'
# commands (never stopping at the first failure), captures every exit status,
# prints ONE final summary naming every gate's verdict, and only THEN exits
# nonzero if any failed -- see the header of that script for the full
# rationale and command-by-command inventory (also reproduced in the commit
# that introduced this job). Folding red/green signals into one job without
# that property would trade several independent signals for one and still
# cost a re-run to find the second failure, which defeats the point of
# folding.
#
# vendor-fidelity:yandex and vendor-fidelity:bing fold in because, despite the
# name, NEITHER makes a network call: both are base-R/jsonlite comparisons of
# the real vendored source tree against a frozen MANIFEST.dcf checked into
# inst/vendor/* (see dev/gates.R's header for the grep that established this).
# A job that actually called out to a live vendor spec would have been left
# separate on purpose -- folding a network-dependent check into the fast gate
# would make the whole gate flaky on a vendor outage.
#
# citation-version does NOT fold in and stays its own job below, on purpose.
# Folding is folding IMAGES, not just commands: lint/readme/docs/both
# vendor-fidelity jobs all already ran on no `image:` override, i.e. the
# `default:` image (`rocker/r-ver:4.6.1`), so combining them changes nothing
# about what interpreter each command runs under. citation-version is the one
# job here that overrode `image:` to `python:3.13-alpine`, and that image
# provides something the default does not: verified directly against the
# EXACT pinned tag --
#   docker run --rm rocker/r-ver:4.6.1 sh -c 'which python3 || echo "NO python3"'
#   -> NO python3
# -- so a `gates` job built on the R default cannot run
# `python3 scripts/check-citation.py` without first installing an interpreter
# the other five gates have no other use for. Tested both ways before
# deciding: `apt-get install -y --no-install-recommends python3` inside
# rocker/r-ver:4.6.1 does work (proven with
# `docker run --rm -v "$PWD":/w -w /w rocker/r-ver:4.6.1 sh -c '...'`,
# check-citation's own self-test and main check both PASS under it), so
# folding was an option, not a blocker. Declined anyway: check-citation.py is
# stdlib-only and offline BY DESIGN -- that is exactly why it was given its
# own minimal image rather than the R toolchain's -- and permanently coupling
# an apt-get install into the R gates image on every merge, forever, just to
# turn this pipeline's 6->2 verify-stage jobs into 6->1 (saving one more
# runner pickup) is a worse trade than leaving the one job that needs a
# second interpreter on the image built for it, at 6->2. citation-version is
# also the cheapest of the six original jobs (5.1s), so the pickup tax it
# still pays is the smallest one left on the table.
#
# news-version and codemeta joined the harness later (ROBO-srowxxtg), then
# spelling (0.3.0 release, ROBO-lvddphcx). The first two replace the GitHub
# workflows M1 deleted. All three also run from the pre-push hook, since on a
# branch that hook is the only gate. See dev/gates.R for the details.
#
# Package installs below are the union of what the five folded jobs installed
# (lintr; devtools; brio/cli/decor/desc/glue/tibble/vctrs + roxygen2 pinned to
# Config/roxygen2/version; jsonlite), plus RURL_GIT and deps::. that every one
# of them needed, plus spelling for the spelling gate.
gates:
  stage: verify
  before_script:
    - *r-binaries
    - *apt-pandoc
    - *install-pak
    - Rscript -e 'pak::pkg_install(c(Sys.getenv("RURL_GIT"), "deps::.", "lintr", "devtools", "brio", "cli", "decor", "desc", "glue", "tibble", "vctrs", "jsonlite", "spelling"))'
    # Same reasoning as the old `docs` job: pinned so an unpinned roxygen2
    # release cannot turn into drift on a tree nobody touched.
    - Rscript -e 'pak::pkg_install(paste0("roxygen2@", read.dcf("DESCRIPTION", "Config/roxygen2/version")[[1]]))'
  script:
    - Rscript dev/gates.R

citation-version:
  stage: verify
  # Kept on its own image on purpose -- see the `gates` job comment above.
  # scripts/check-citation.py is stdlib-only, so `python:3.13-alpine` is all
  # this job needs; it never touches the R toolchain.
  image: python:3.13-alpine
  script:
    - python3 scripts/check-citation.py --self-test
    - python3 scripts/check-citation.py
    # Same image, same reasoning: stdlib-only and offline (SEOR-ocbtrrnl).
    - python3 scripts/check-bugreports.py --self-test
    - python3 scripts/check-bugreports.py

# ---- stage: check ------------------------------------------------------------

check:
  stage: check
  needs: ["gates"]
  before_script:
    - *r-binaries
    - *apt-pandoc
    - *install-pak
    # `deps::.` installs HARD dependencies only. --as-cran builds the knitr
    # vignette and runs the testthat suite, and knitr/rmarkdown/testthat all
    # live in Suggests, so the package's soft dependencies are installed
    # separately below. rurl goes first: CRAN serves 1.2.0, under the declared
    # floor, so the local solve has to find it already present from git.
    # Scoped to the local package on purpose -- a blanket `dependencies = TRUE`
    # on this vector would also pull rurl's own Suggests, pkgdown included.
    - Rscript -e 'pak::pkg_install(c(Sys.getenv("RURL_GIT"), "rcmdcheck"))'
    - Rscript -e 'pak::local_install_deps(dependencies = TRUE, upgrade = FALSE)'
  script:
    # Strict CRAN-grade pass on the fast gate, warnings fatal. The scheduled
    # deep-check legs below repeat it on R release, oldrel, devel and the
    # declared floor.
    # rcmdcheck reads a check that halted partway as 0/0/0 and returns normally,
    # so error_on never fires. The guard also fails on R CMD check's own exit
    # status (SEOR-maavnxdm).
    - |
      Rscript -e '
        res <- rcmdcheck::rcmdcheck(
          args = c("--no-manual", "--as-cran"),
          build_args = "--no-manual",
          error_on = "warning"
        )
        if (!identical(as.integer(res$status), 0L)) stop("R CMD check exited with status ", res$status, "; the run did not complete.", call. = FALSE)
      '
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - "*.Rcheck/"

# ---- deep-check (scheduled) -------------------------------------------------

# The weekly release-shaped checks (seor design/fleet-standard.md,
# "deep-check"). Only a pipeline schedule that sets SCHEDULE_KIND=deep-check
# runs them, blocking; any other schedule falls to `when: never`. A
# hand-started `web` pipeline offers them as manual, non-blocking jobs, as the
# audits below do. Never on a push to main or a tag.
#
# `cache: []` on every leg: the shared cache holds a library built under the
# default image's R, and loading it under another R, or under the sanitizer
# build, fails in ways that read like package bugs; a leg writing its own
# library back would poison the merge gate's cache the same way.
.deep-check:
  stage: check
  needs: []
  cache: []
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_KIND == "deep-check"
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
    - when: never
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - check/
      - "*.Rcheck/"

# R release, oldrel and devel, each the same --as-cran check as `check`.
# 'latest' tracks the current R release; bump the pinned oldrel tag when a new
# minor R ships. The two R_CRAN_* variables move `checking CRAN incoming
# feasibility` off p3m, which serves none of the metadata that step reads, to
# cloud.r-project.org; package installs still come from p3m (SEOR-ygzjighu,
# punycoder's full-check).
full-check:
  extends: .deep-check
  image: $R_IMAGE
  variables:
    R_CRAN_SRC: "https://cloud.r-project.org"
    R_CRAN_WEB: "https://cloud.r-project.org"
  parallel:
    matrix:
      - R_IMAGE:
          - "rocker/r-ver:latest"
          - "rocker/r-ver:4.5"
          - "rocker/r-ver:devel"
  before_script:
    - *r-binaries
    - *apt-pandoc
    # qpdf: R 4.5's --as-cran raises a WARNING, "'qpdf' is needed for checks
    # on size reduction of PDFs", when the binary is absent, and error_on =
    # "warning" turns that red (pipeline 2909410786, the 4.5 leg). R 4.6 does
    # not ask, which is why `check` on the default image never needed it. No
    # rocker/r-ver image ships qpdf; punycoder's full-check installs it too.
    - apt-get update -qq && apt-get install -y --no-install-recommends qpdf && rm -rf /var/lib/apt/lists/*
    - *install-pak
    - Rscript -e 'pak::pkg_install(c(Sys.getenv("RURL_GIT"), "rcmdcheck"))'
    - Rscript -e 'pak::local_install_deps(dependencies = TRUE, upgrade = FALSE)'
  script:
    # rcmdcheck reads a check that halted partway as 0/0/0 and returns
    # normally, so error_on never fires; the guard also fails on R CMD check's
    # own exit status (SEOR-maavnxdm).
    - >
      Rscript -e 'res <- rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran"),
      build_args = "--no-manual", error_on = "warning", check_dir = "check");
      if (!identical(as.integer(res$status), 0L)) stop("R CMD check exited with status ", res$status, "; the run did not complete.", call. = FALSE)'

# The leg at the declared R floor, `Depends: R (>= 4.1.0)`, in punycoder's
# floor-check shape. 4.1 is the oldest minor with an arm64 rocker/r-ver image,
# which the runner needs (4.0.5 has none).
#
# - Third-party packages come from one dated Posit Package Manager snapshot,
#   FLOOR_SNAPSHOT, installed with base install.packages() (source builds).
#   2025-07-15 is the first snapshot carrying httr2 1.2.0, the version
#   DESCRIPTION requires; R 4.1 stayed inside every dependency's support window
#   until R 4.6.0. The first run used 2025-04-10 and got httr2 1.1.2, whose
#   req_perform_connection() neither returns a StreamingBody nor honors
#   mocked responses (pipeline 2909410786, 190 test failures; SEOR-thlzqzac).
#   The snapshot lives in this job alone, so it cannot conflict with what the
#   release and devel legs install.
# - The fleet packages (punycoder, pslr, rurl) postdate that snapshot, so they
#   come from current CRAN, whose versions declare R >= 4.0 or 4.1. Their own
#   dependencies are already installed from the snapshot by then.
# - Only what the check needs is installed: the hard dependencies, the test
#   and vignette Suggests, and rcmdcheck. oysteR and rosv serve only the
#   scheduled audits, whose tests skip without them, so
#   _R_CHECK_FORCE_SUGGESTS_=false lets --as-cran report them as a NOTE
#   instead of stopping.
# - Vignettes are neither built nor checked: no pandoc in this job, and the
#   vignette exercises the same functions the tests do.
floor-check:
  extends: .deep-check
  image: rocker/r-ver:4.1.3
  variables:
    FLOOR_SNAPSHOT: "https://packagemanager.posit.co/cran/2025-07-15"
    R_CRAN_SRC: "https://cloud.r-project.org"
    R_CRAN_WEB: "https://cloud.r-project.org"
    _R_CHECK_FORCE_SUGGESTS_: "false"
  script:
    - apt-get update -qq && apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev zlib1g-dev pkg-config
    - >
      Rscript -e 'install.packages(c("cpp11", "httr2", "Rcpp", "stringi", "digest",
      "testthat", "callr", "httpuv", "jsonlite", "knitr", "rmarkdown", "rcmdcheck"),
      repos = Sys.getenv("FLOOR_SNAPSHOT"), Ncpus = 4L);
      install.packages(c("punycoder", "pslr", "rurl"),
      repos = "https://cloud.r-project.org", Ncpus = 4L);
      stopifnot(all(vapply(c("cpp11", "httr2", "rurl", "testthat", "rcmdcheck"), requireNamespace, NA, quietly = TRUE)));
      print(R.version.string)'
    # Same guard as full-check (SEOR-maavnxdm).
    - >
      Rscript -e 'res <- rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran", "--ignore-vignettes"),
      build_args = c("--no-manual", "--no-build-vignettes"),
      error_on = "warning", check_dir = "check");
      if (!identical(as.integer(res$status), 0L)) stop("R CMD check exited with status ", res$status, "; the run did not complete.", call. = FALSE)'

# Dynamic analysis of the compiled code -- the vendored Google, Bing and
# Yandex matchers and this package's cpp11 bindings -- in punycoder's
# `sanitizers` shape: R CMD check inside R-hub's clang-ASAN/UBSAN container,
# pulled directly. No p3m binaries here: everything builds from source under
# the sanitizer toolchain.
#
# There is no valgrind leg. R-hub's valgrind image is x86_64 and cannot start
# R under Rosetta on this fleet's arm64 runner (punycoder PUNY-pxdhoaov);
# valgrind comes from R-hub's own runners before a CRAN submission
# (CONTRIBUTING.md, release checklist step 6).
#
# `--ignore-vignettes`: the tarball is built without vignettes (no pandoc in
# the image), and checking it otherwise reports WARNINGs about the missing
# vignette output on every run. The test suite exercises the same functions.
sanitizers:
  extends: .deep-check
  image: ghcr.io/r-hub/containers/clang-asan
  script:
    - mkdir -p "$R_LIBS_USER"
    - Rscript -e 'if (!requireNamespace("pak", quietly = TRUE)) install.packages("pak")'
    - Rscript -e 'pak::pkg_install(Sys.getenv("RURL_GIT"))'
    - Rscript -e 'pak::local_install_deps(dependencies = TRUE, upgrade = FALSE)'
    - R CMD build --no-build-vignettes --no-manual .
    - R CMD check --no-manual --ignore-vignettes robotstxtr_*.tar.gz

# ---- stage: report -----------------------------------------------------------

coverage:
  stage: report
  needs: ["check"]
  before_script:
    - *r-binaries
    - *apt-pandoc
    - *install-pak
    # Same Suggests problem as `check`: covr runs the testthat suite, which
    # needs testthat, httpuv, jsonlite, callr, oysteR and rosv -- all Suggests.
    - Rscript -e 'pak::pkg_install(c(Sys.getenv("RURL_GIT"), "covr", "xml2"))'
    - Rscript -e 'pak::local_install_deps(dependencies = TRUE, upgrade = FALSE)'
  script:
    # covr's coverage percentage only reaches the log if the object is
    # printed; passing it straight to to_cobertura() would leave the
    # `coverage:` regex below with nothing to match.
    #
    # The job fails below 95% total coverage, the fleet minimum (seor
    # design/fleet-standard.md, ADR 0007 there). It writes cobertura.xml first,
    # so a failing run still annotates the diff. The threshold is never
    # lowered: a package under it adds tests.
    - |
      Rscript -e '
        cov <- covr::package_coverage(quiet = FALSE)
        print(cov)
        covr::to_cobertura(cov)
        pct <- covr::percent_coverage(cov)
        if (pct < 95) stop(sprintf("total coverage %.2f%% is below the fleet minimum of 95%%; add tests, never lower the threshold", pct), call. = FALSE)
      '
  coverage: '/Coverage: \d+\.\d+\%/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cobertura.xml

# ---- stage: deploy -----------------------------------------------------------

# The pkgdown site. Ported from .github/workflows/pkgdown.yaml, which targeted
# GitHub (now a read-only mirror that runs no CI) and last ran 2026-08-07
# (ROBO-qqwkldzv), and modeled on the sibling pagerankr's `pages` job.
#
# `pkgdown::build_site()` writes to docs/, which is both .gitignored and
# .Rbuildignored here, so the site is a pure build artifact; GitLab Pages
# publishes `public/`, hence the move.
#
# robotstxtr itself must be INSTALLED, not merely loaded: build_reference()
# EVALUATES the examples, and those call library(robotstxtr). Building with
# install = FALSE and no installed copy dies at the first example with "there is
# no package called 'robotstxtr'". The GitHub workflow got this for free from
# r-lib/actions' `extra-packages: local::.`; on GitLab it has to be explicit --
# and here that install also compiles the vendored C++ matcher, so it is the
# expensive step of this job.
#
# local_install_deps(dependencies = TRUE) rather than `deps::.`: the vignettes
# and examples pkgdown renders reach into Suggests (knitr, rmarkdown, httpuv,
# jsonlite, callr), exactly as the `check` job does. rurl goes in first from its
# pinned git tag for the same reason as everywhere else in this file.
#
# pkgdown:::package_mds() renders every top-level .md except a hardcoded skip
# list (README.md/LICENSE(.md|CE.md)/NEWS.md, handled elsewhere) and a
# hardcoded no_render list (cran-comments.md, issue/PR templates); _pkgdown.yml
# has no setting that can add to either, so AGENTS.md, CLAUDE.md, FP_AGENTS.md
# and FP_CLAUDE.md were being published as pages -- and folded into
# search.json, where their text outranks real docs -- once the site went
# public (SEOR-pibdjanz).
#
# This used to be a 4-name deny list (`rm -f AGENTS.md CLAUDE.md FP_AGENTS.md
# FP_CLAUDE.md`), which is fail-OPEN: it does not cover a new name inside
# those families, let alone a new family such as GEMINI.md, and a future
# agent tool's instruction file would be published by default (SEOR-wqxhftpv).
# Inverted to a keep-list below: every top-level *.md is moved out UNLESS it
# is explicitly meant for the site, so an unknown file stays private by
# default. Moved rather than deleted (the `mv` shape, adopted from pslr's
# equivalent job) so a later reader of search.json never finds a link to a
# page that 404s. Fails loud, not silently, if a known agent file is somehow
# still in the root afterwards -- a rename or a keep-list mistake must break
# the pipeline, not quietly start publishing the file again.
.pkgdown-site:
  stage: deploy
  needs:
    - job: check
      artifacts: false
  before_script:
    - *r-binaries
    - *apt-pandoc
    - *install-pak
    - Rscript -e 'pak::pkg_install(c(Sys.getenv("RURL_GIT"), "pkgdown"))'
    - Rscript -e 'pak::local_install_deps(dependencies = TRUE, upgrade = FALSE)'
    - Rscript -e 'pak::local_install(upgrade = FALSE)'
  script:
    - |
      set -e
      mkdir -p /tmp/agent-md
      keep="README.md NEWS.md LICENSE.md LICENCE.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md THIRD_PARTY_NOTICES.md cran-comments.md CHANGELOG.md"
      for f in *.md; do
        case " $keep " in
          *" $f "*) continue ;;
        esac
        mv "$f" /tmp/agent-md/
      done
      for sensitive in AGENTS.md CLAUDE.md FP_AGENTS.md FP_CLAUDE.md; do
        if [ -f "$sensitive" ]; then
          echo "ERROR: $sensitive is still present after the agent-md filter; refusing to build the public site." >&2
          exit 1
        fi
      done
    - Rscript -e 'pkgdown::build_site(new_process = FALSE, install = FALSE)'
    - mv docs public
  artifacts:
    paths:
      - public

# Must be named `pages` and publish `public/` -- that pairing is what GitLab
# Pages deploys, not a convention this file chose.
#
# Default branch only: a site rebuilt from every merge request would publish
# unreviewed docs to the same URL, and this namespace bills 400 compute minutes
# a month.
pages:
  extends: .pkgdown-site
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# `pkgdown-preview` (extended .pkgdown-site, rules: merge_request_event only,
# manual, allow_failure) was removed under SEOR-bmgkzhvy: MR pipelines are
# suppressed fleet-wide (see `workflow:` above), so its one rule could never
# match again -- dead config that would have rotted silently. It existed so a
# merge request touching the site could prove a changed pkgdown recipe before
# it reached main; that capability is gone on purpose. The first run of a
# changed recipe is now on `main`, via `pages` itself.

# ---- stage: audit ------------------------------------------------------------

# Dependency vulnerability audits (SEOR-fftbjnpl), modeled on seor's
# `osv-audit` / `security-audit` and punycoder's SCHEDULE_KIND guard
# (SEOR-ihmntqzm). They run tests/testthat/test-osv.R and test-security.R,
# which already exist and are unchanged here.
#
# WHEN THEY RUN. Only on a pipeline schedule that sets the CI/CD variable
# SCHEDULE_KIND=dependency-audit, or from a hand-started `web` pipeline (manual,
# non-blocking there). Never on a push to main, a tag, or any other schedule: a
# schedule alone is not a selector, and a job guarded only by
# `$CI_PIPELINE_SOURCE == "schedule"` would fire on every schedule this project
# ever adds. The `workflow:` block above already admits a schedule pipeline on
# the default branch (its `$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH` rule), so
# these are not dead config. A scheduled run is BLOCKING: these are detectors,
# and a detector that cannot turn a pipeline red is worthless.
#
# OWNER GATES, not doable from a commit:
#   - Create the schedule (Build > Pipeline schedules, ref `main`, weekly) and
#     give it the variable SCHEDULE_KIND=dependency-audit.
#   - Set OSSINDEX_USER and OSSINDEX_TOKEN as project CI/CD variables (OSS
#     Index answers anonymous requests with HTTP 401). Until both exist,
#     `security-audit` is red on purpose and says why; `osv-audit` needs no
#     account.
#
# Note that such a schedule pipeline also runs every job above that has no
# `rules:` (gates, citation-version, check, coverage) and `pages`, which is
# pinned to the default branch, not to a pipeline source.
#
# NO-SKIP GUARD. A skipped audit reports success having audited nothing (the
# failure PUNY-rsxtbbln records). test-security.R turns its own preconditions
# into failures under OSSINDEX_AUDIT_REQUIRED=true. test-osv.R has no such
# flag, and it skips silently when robotstxtr is not INSTALLED: it resolves the
# runtime closure from installed.packages(), and under test_local()'s pkgload
# the package is loaded but not installed, so the closure comes back empty and
# `skip_if(length(deps) == 0)` fires. So robotstxtr is installed below, and
# each job fails if any test in its file was skipped, without touching the
# tests themselves.
.audit:
  stage: audit
  needs: []
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_KIND == "dependency-audit"
    # Under `rules`, `when: manual` defaults to `allow_failure: false`, which
    # would leave a hand-started pipeline blocked on a job nobody meant to gate
    # on; hence the explicit allow_failure.
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
    - when: never
  variables:
    # Belt and braces so skip_on_cran() cannot skip the audit silently.
    NOT_CRAN: "true"
  before_script:
    - *r-binaries
    - *apt-pandoc
    - *install-pak
    # rurl from its pinned tag first, as everywhere else in this file; then
    # the Suggests set (rosv, oysteR, testthat); then robotstxtr itself, which
    # test-osv.R needs installed (see NO-SKIP GUARD above).
    - Rscript -e 'pak::pkg_install(Sys.getenv("RURL_GIT"))'
    - Rscript -e 'pak::local_install_deps(dependencies = TRUE, upgrade = FALSE)'
    - Rscript -e 'pak::local_install(upgrade = FALSE)'

# OSV database (https://osv.dev) via {rosv}. No account, token or variable.
osv-audit:
  extends: .audit
  script:
    - |
      Rscript -e '
        res <- as.data.frame(testthat::test_local(filter = "osv", stop_on_failure = TRUE))
        if (nrow(res) == 0L || any(res$skipped)) {
          stop("osv-audit ran no audit: a test in test-osv.R was skipped or none ran.")
        }
      '

# Sonatype OSS Index via {oysteR}. Needs OSSINDEX_USER / OSSINDEX_TOKEN (see
# OWNER GATES above). OSSINDEX_AUDIT_REQUIRED is set here and nowhere else, so
# local runs, the pre-push gate and R CMD check still skip; in this job a
# missing precondition is a failure (tests/testthat/test-security.R).
security-audit:
  extends: .audit
  variables:
    NOT_CRAN: "true"
    OSSINDEX_AUDIT_REQUIRED: "true"
  script:
    - |
      Rscript -e '
        res <- as.data.frame(testthat::test_local(filter = "security", stop_on_failure = TRUE))
        if (nrow(res) == 0L || any(res$skipped)) {
          stop("security-audit ran no audit: a test in test-security.R was skipped or none ran.")
        }
      '
