# GitLab CI for robotstxtr: fleet-ci's template, pinned by commit SHA (seor
# ADR 0012, fleet-ci README "The CI template"). The template owns the event
# table, the jobs and the images; this file sets only the package's switches
# and adds its x-floor and x-macos jobs. A push to main or a branch, and a merge request,
# create no pipeline: the merge gate is the local one (.fleet-ci/gate, run by
# the .fleet-ci/pre-push hook; settings in .fleet-ci.yml). T2 runs on the
# deep-check schedule (SCHEDULE_KIND=deep-check, schedule 4472810), T3 on a
# RELEASE=1 web pipeline and a v* tag. The dependency-audit schedule
# (4467473) gets no pipeline: osv-audit and security-audit run in T2.
# design/ci.md says what moved where.
#
# Every other switch keeps the template's default. robotstxtr has compiled
# code (the vendored Google, Bing and Yandex matchers and its cpp11
# bindings), so t2-sanitizers runs R-hub's clang-asan container, an amd64
# image, under emulation on the arm64 runner; t2-locale builds .fleet-ci.yml's
# case-folding locales and runs scripts/check-locale-legs.R after its leg.
#
# Bump the pin by changing `ref:` and re-running fleet-ci's bin/vendor at the
# same SHA, in one merge request: .fleet-ci/VERSION must equal `ref:`.
include:
  - project: bart-turczynski/fleet-ci
    ref: 66d8d2d4b888aeb00c4afad15d953a390fd2e9d8
    file: templates/r-package.yml

variables:
  # The template's t2-floor installs every dependency from one dated
  # snapshot, and robotstxtr's floor closure cannot come from one: rurl (>=
  # 3.0.1) puts that snapshot in late 2026, whose curl (httr2's) wants
  # libcurl >= 7.73, while rocker/r-ver:4.1.3 has focal's 7.68 and no headers,
  # and the arm64 runner gets source packages only. So the floor leg is
  # x-floor, on .t2-job, in its place.
  FLEET_FLOOR: "false"

# The deep-check leg at the declared R floor, `Depends: R (>= 4.1.0)`, in
# place of the template's t2-floor (FLEET_FLOOR above): the former
# `floor-check` job, with the template's completion guard and its rules from
# .t2-job. 4.1.3 is the last 4.1 patch and the oldest minor rocker publishes
# an arm64 image for, which the runner needs.
#
# - Third-party packages come from one dated Posit Package Manager snapshot,
#   FLOOR_SNAPSHOT, as source builds (the runner is arm64 and that URL serves
#   source), with the libcurl and OpenSSL headers apt installs. 2025-07-15,
#   the former floor-check's date.
# - The fleet packages postdate that snapshot, so they come after it from
#   current CRAN: punycoder, pslr, raddr and rurl (DESCRIPTION wants >=
#   3.0.1), as the former floor-check took punycoder, pslr and rurl. raddr
#   needs rlang >= 1.1.7 and vctrs >= 0.7.0, newer than the snapshot's, so
#   those two come from CRAN in the same call. All declare R >= 4.1 or lower.
# - curl and webfakes come from CRAN without dependencies, as in ssrfr's own
#   x-floor: ssrfr needs curl >= 7.0.0 (the snapshot has 6.4.0), and every R
#   curl since 7.0.0 wants libcurl >= 7.73 while focal has 7.68.0, so the
#   curl binary is in the apt line: curl's configure then fetches a static
#   libcurl with it. webfakes serves the loopback fetch tests.
# - TEMPORARY ssrfr pin. ssrfr 1.0.0 is in CRAN's queue, so it comes from
#   GitLab at SSRFR_SHA, the commit submitted to CRAN, as DESCRIPTION's
#   Remotes says, without dependencies (they are installed above). Once CRAN
#   serves ssrfr, move it into the CRAN list and drop SSRFR_SHA and this
#   item (ROBO-eqmoyyho).
# - Only what the check needs is installed: the hard dependencies, the test
#   and vignette Suggests, and rcmdcheck. oysteR and rosv serve the audits,
#   whose tests skip without them, so _R_CHECK_FORCE_SUGGESTS_=false lets
#   --as-cran report them as a NOTE instead of stopping.
# - Vignettes are neither built nor checked: no pandoc in this image.
# - No hostile locales are built, so the case-folding legs skip here;
#   t2-locale and the local gate run them.
#
# BLOCKING, like every T2 leg: a scheduled detector that cannot go red is
# worthless. A cold docker run of this job's script in rocker/r-ver:4.1.3
# (arm64) passed on 2026-11-05 with rurl 3.1.0, ssrfr at SSRFR_SHA and curl
# on its static libcurl 8.14.1: 4 NOTEs, no WARNING (ROBO-jbralthm).
x-floor:
  extends: .t2-job
  image: rocker/r-ver:4.1.3
  variables:
    FLOOR_SNAPSHOT: "https://packagemanager.posit.co/cran/2025-07-15"
    # The ssrfr commit submitted to CRAN (comment above, ROBO-eqmoyyho).
    SSRFR_SHA: "ddb33892d343c890bcca8345c8f15e9f82da9f63"
    R_CRAN_SRC: "https://cloud.r-project.org"
    R_CRAN_WEB: "https://cloud.r-project.org"
    _R_CHECK_FORCE_SUGGESTS_: "false"
    # Incoming off: .t2-job runs this leg in v* tag pipelines too, where the
    # incoming feasibility check's "Insufficient package version" (the tag's
    # version already on CRAN) would fail it and so block `pages`. t2-ascran
    # runs the incoming checks, on R release.
    _R_CHECK_CRAN_INCOMING_: "false"
  script:
    - apt-get update -qq && apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev zlib1g-dev pkg-config curl
    - >
      Rscript -e 'install.packages(c("cpp11", "Rcpp", "stringi", "digest",
      "testthat", "webfakes", "jsonlite", "knitr", "rmarkdown", "rcmdcheck"),
      repos = Sys.getenv("FLOOR_SNAPSHOT"), Ncpus = 4L);
      install.packages(c("rlang", "vctrs", "punycoder", "pslr", "raddr", "rurl"),
      repos = "https://cloud.r-project.org", Ncpus = 4L);
      install.packages(c("curl", "webfakes"), repos = "https://cloud.r-project.org",
      dependencies = FALSE, Ncpus = 4L);
      sha <- Sys.getenv("SSRFR_SHA"); tgz <- file.path(tempdir(), "ssrfr.tar.gz");
      download.file(paste0("https://gitlab.com/bart-turczynski/ssrfr/-/archive/", sha, "/ssrfr-", sha, ".tar.gz"), tgz, mode = "wb");
      install.packages(tgz, repos = NULL, type = "source");
      stopifnot(all(vapply(c("cpp11", "ssrfr", "rurl", "webfakes", "testthat", "rcmdcheck"), requireNamespace, NA, quietly = TRUE)));
      stopifnot(packageVersion("curl") >= "7.0.0", packageVersion("ssrfr") >= "1.0.0");
      print(R.version.string); print(curl::curl_version()$version)'
    # The template's guard: rcmdcheck reads a check that halted partway as
    # 0/0/0 and returns normally, so the check must have written a Status
    # line, exited 0 and reported no ERROR or WARNING (SEOR-maavnxdm).
    - >
      Rscript -e 'res <- rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran", "--ignore-vignettes"),
      build_args = c("--no-manual", "--no-build-vignettes"),
      error_on = "never", check_dir = "check");
      print(res);
      log <- file.path(res$checkdir, "00check.log");
      if (!file.exists(log) || !any(grepl("^Status:", readLines(log, warn = FALSE)))) stop("R CMD check did not complete", call. = FALSE);
      if (!identical(as.integer(res$status), 0L)) stop("R CMD check exited with status ", res$status, call. = FALSE);
      if (length(res$errors) || length(res$warnings)) stop("ERROR or WARNING", call. = FALSE)'
  artifacts:
    when: always
    paths:
      - check/
    expire_in: 1 week

# One R CMD check on macOS (arm64, Apple clang), the platform every other job
# misses (ROBO-sdltipng). It runs on `mac-shell`, the shell-executor runner
# on the maintainer's Mac (tag `macos`; it takes no untagged job), so there is
# no image: R is the Mac's own CRAN build at /usr/local/bin.
#
# - When: the deep-check schedule only, through .schedule-job, including a
#   hand-started "Run pipeline schedule" (Build > Pipeline schedules, the play
#   button). Not .t2-job: that would put it in v* tag and RELEASE=1 pipelines
#   too, where a sleeping Mac would hold `pages` until the job timed out.
# - Stage `report`, so it starts after the Linux check legs, not beside them
#   on the same Mac, and no later stage waits on it in a deep-check pipeline.
# - allow_failure: a sleeping laptop or an offline runner must never turn the
#   weekly pipeline red. A red x-macos is a finding to read, not a pass.
# - Library: R's framework library is writable on that Mac, so nothing may
#   install into it. Every dependency, pak and rcmdcheck included, goes into
#   R_LIBS_USER, a per-project library per R minor under
#   ~/Library/Caches/gitlab-ci/ (MACOS_R_LIB_ROOT overrides the root), which
#   persists between runs as a cache; pak installs with upgrade = FALSE.
# - The check: --as-cran with incoming off, vignettes built (pandoc and qpdf
#   are on the Mac), and x-floor's guard (a Status line, exit 0, no ERROR or
#   WARNING). The template's LC_ALL is C.UTF-8, so the script sets
#   en_US.UTF-8, which macOS has; the case-folding legs stay with t2-locale.
x-macos:
  extends: .schedule-job
  stage: report
  tags:
    - macos
  allow_failure: true
  timeout: 1h
  variables:
    FLEET_JOB_SCHEDULE: "deep-check"
    NOT_CRAN: "true"
    _R_CHECK_CRAN_INCOMING_: "false"
    _R_CHECK_CRAN_INCOMING_REMOTE_: "false"
  script:
    - export PATH="/usr/local/bin:$PATH"
    - unset OSSINDEX_USER OSSINDEX_TOKEN
    - export LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8
    - R_MINOR="$(Rscript -e 'cat(R.version$major, sub("[.].*$", "", R.version$minor), sep = ".")')"
    - export R_LIBS_USER="${MACOS_R_LIB_ROOT:-$HOME/Library/Caches/gitlab-ci/robotstxtr-R-lib}/$R_MINOR"
    - mkdir -p "$R_LIBS_USER"
    - >
      Rscript -e 'lib <- normalizePath(Sys.getenv("R_LIBS_USER"), mustWork = TRUE);
      if (!identical(normalizePath(.libPaths()[1L]), lib)) stop("R_LIBS_USER is not first on .libPaths()", call. = FALSE);
      options(repos = c(CRAN = "https://cloud.r-project.org"));
      if (!nzchar(system.file(package = "pak", lib.loc = lib))) install.packages("pak", lib = lib);
      library(pak, lib.loc = lib);
      pak::pkg_install(c("deps::.", "any::rcmdcheck"), dependencies = TRUE, lib = lib, upgrade = FALSE);
      print(R.version.string); print(.libPaths())'
    - >
      Rscript -e 'res <- rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran"),
      build_args = "--no-manual", error_on = "never", check_dir = "check");
      print(res);
      log <- file.path(res$checkdir, "00check.log");
      if (!file.exists(log) || !any(grepl("^Status:", readLines(log, warn = FALSE)))) stop("R CMD check did not complete", call. = FALSE);
      if (!identical(as.integer(res$status), 0L)) stop("R CMD check exited with status ", res$status, call. = FALSE);
      if (length(res$errors) || length(res$warnings)) stop("ERROR or WARNING", call. = FALSE)'
  artifacts:
    when: always
    paths:
      - check/
    expire_in: 1 week
