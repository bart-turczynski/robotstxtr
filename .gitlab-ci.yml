# Fast verification gate: lint + a single Ubuntu --as-cran R CMD check +
# coverage + README-sync + generated-docs-sync + the two vendored-tree fidelity
# checks, on every push to main (and on tag pipelines). Merge-request and
# feature-branch pipelines are suppressed fleet-wide (SEOR-bmgkzhvy) -- see the
# `workflow:` block below -- so this no longer runs "on every merge request".
# The cross-platform matrix and the ASAN/valgrind sanitizer runs live in a
# separate, manually triggered pipeline (ROBO-mkuskipr) because this namespace
# has 400 compute minutes per month and a 6-entry matrix would exhaust them in
# two runs.
#
# Ported from .github/workflows/verify.yml (ROBO-tkmclvsg). The GitHub account
# `bart-turczynski` is suspended, so GitLab is now the only forge.
#
# DEPENDENCY RESOLUTION. When this gate was written `rurl (>= 2.2.1)` was not on
# CRAN -- CRAN served 1.2.0 -- and the R-universe staging repo that used to cover
# the gap is gone with the GitHub account that hosted its registry. So rurl is
# installed straight from its GitLab git URL. Its own imports (stringi,
# punycoder >= 1.2.0, pslr >= 1.1.0) are all satisfied by current CRAN, so rurl
# is the ONLY git dependency.
#
# `RURL_GIT` is PINNED to the `v3.0.1` tag (commit 0ca8f09). It used to track
# rurl's default branch, which made every run here test rurl's development head
# -- pipeline 2838356532 installed `rurl 3.0.1.9000` -- so a rurl commit could
# turn this pipeline red on a robotstxtr tree nobody touched, and CI was not
# exercising what a user would install. Move the pin deliberately when
# robotstxtr is ready for a newer rurl; do not drop it back to the branch
# (ROBO-hzcnolhe).
#
# The pin stays on git rather than resolving rurl from the repos configured
# below, because the git tag is the one coordinate this file fixes itself. CRAN
# published rurl 3.0.1 on 2026-09-09 and its p3m mirror -- which `.r-binaries`
# puts FIRST -- still served 1.2.0 more than a day later, so repo resolution was
# not a reliable substitute at the moment the pin was made.

# One pipeline per merge, not three (SEOR-bmgkzhvy). These are NOT GitLab.com
# shared runners and concurrency is NOT capped at 1 -- both were previously
# claimed here and are false (SEOR-gpafxhua). The truth, verified 2026-09-23:
# self-hosted Docker runners on one Mac, registered from
# ~/.gitlab-runner/config.toml, with `concurrent = 4` -- a number this fleet
# owns, not a platform limit. Full detail in
# seor/design/adr/0003-fleet-ci-runs-on-self-hosted-runners.md. That does not
# make duplicate pipelines free: a branch pipeline and its merge-request
# pipeline still test the same tree the `main` pipeline is about to test again
# a few minutes later, competing for the same laptop's four slots and its
# compute budget -- and the two useless ones are CREATED FIRST, so they
# contend with the pipeline that actually gates the work (main). Measured
# repeatedly: a deleted branch's pipeline dies at get_sources (exit 128) or
# worse, runs to completion against a tree nobody can see any more, and an
# already-merged MR's pipeline has been seen holding a runner slot for 30+
# minutes. Previously this block ran a duplicate-pipeline GUARD (suppress the
# branch pipeline only when an MR was open) plus an unconditional `web` rule;
# that guard never touched the MR pipeline, which is what actually caused the
# stalls, so it was replaced rather than kept alongside this rule set.
#
# Costs, accepted deliberately:
#   - No CI on feature-branch pushes at all. The local pre-push verify gate
#     (dev/verify.sh) is what actually blocks bad code before it leaves the
#     machine; only_allow_merge_if_pipeline_succeeds is false here, so a CI
#     result has never gated a merge in this project.
#   - No CI result visible before clicking merge (no MR pipeline).
#   - GitLab's per-line coverage annotations in an MR diff need a pipeline
#     attached to the MR; none is created now, so those annotations stop
#     appearing. The coverage badge (sourced from main) is unaffected.
#   - An API-triggered pipeline on a non-default branch falls through to
#     `when: never` and creates nothing. Hand-started `web` pipelines are the
#     exception and are listed below; `glab ci run` uses the api source, so it
#     is not a substitute for the button on a branch.
#
# The `web` rule is back, and deliberately so. It was dropped with the rest of
# the old rule set, which cost this project the escape hatch it used to unblock
# a jammed queue, and the only way left to get a server-side answer about a
# branch was to merge it first. Admitting it does not reopen the problem above:
# that was entirely push- and merge-request-driven, whereas `web` requires a
# human to open Build > Pipelines > Run pipeline and pick a ref. Started on a
# branch it runs the full gate there -- gates (lint, readme, docs,
# citation-version, both vendor-fidelity legs), check and coverage. `pages` is
# pinned to the default branch and stays unreachable, so the hatch verifies a
# branch but never publishes one (SEOR-bmgkzhvy).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never
  auto_cancel:
    on_new_commit: interruptible

default:
  image: rocker/r-ver:4.6.1
  interruptible: true
  cache:
    # Keyed on DESCRIPTION: any dependency change invalidates the library.
    key:
      files:
        - DESCRIPTION
    paths:
      - .r-lib/

variables:
  R_LIBS_USER: "$CI_PROJECT_DIR/.r-lib"
  R_KEEP_PKG_SOURCE: "yes"
  LINTR_ERROR_ON_LINT: "true"
  # rurl pinned to its v3.0.1 tag; see the DEPENDENCY RESOLUTION note above.
  RURL_GIT: "git::https://gitlab.com/bart-turczynski/rurl.git@v3.0.1"
  GIT_DEPTH: "1"

stages:
  - verify
  - check
  - report
  - deploy

# ---- shared setup ------------------------------------------------------------

# Posit Package Manager serves Linux BINARIES for CRAN packages, which is what
# keeps this pipeline inside the compute budget -- source-building httr2 and
# stringi on every job would multiply the cost. The codename is read from the
# image at runtime rather than hardcoded, so a base-image bump cannot silently
# drop us back to source installs. The HTTPUserAgent is what P3M keys the binary
# response on; without it the same URL quietly serves source tarballs.
.r-binaries: &r-binaries |
  . /etc/os-release
  mkdir -p "$R_LIBS_USER"
  cat > /tmp/ci-repos.R <<'RPROFILE'
  local({
    codename <- Sys.getenv("CI_OS_CODENAME")
    options(
      repos = c(
        P3M = sprintf(
          "https://packagemanager.posit.co/cran/__linux__/%s/latest", codename
        ),
        CRAN = "https://cloud.r-project.org"
      ),
      HTTPUserAgent = sprintf(
        "R/%s R (%s)", getRversion(),
        paste(getRversion(), R.version$platform, R.version$arch, R.version$os)
      ),
      Ncpus = max(1L, parallel::detectCores())
    )
  })
  RPROFILE
  export CI_OS_CODENAME="$VERSION_CODENAME"
  export R_PROFILE_USER=/tmp/ci-repos.R
  # Put the cached library FIRST so installs land in it. Setting R_LIBS_USER
  # (see variables: above) is NOT enough: rocker/r-ver's Renviron.site puts
  # /usr/local/lib/R/site-library FIRST in .libPaths() and R_LIBS_USER third,
  # so R installs into the image and it dies with the container -- the cache
  # then carries pak's downloads but never a built library, which is the
  # expensive half on this fleet's arm64 runners (p3m has no arm64 binaries,
  # so every dependency compiles from source). Appended to Rprofile.site
  # rather than set as an environment variable because Renviron.site is read
  # later and overrides the environment; R_LIBS_SITE does not work either, for
  # the same reason. site-library stays on the path behind it, so the image's
  # own packages (docopt, littler) remain visible. Verified against
  # rocker/r-ver:4.5.1 directly, and landed first in seor (SEOR-dyzgzyot; see
  # seor/design/adr/0003-fleet-ci-runs-on-self-hosted-runners.md for the
  # measured before/after). The print line makes each run self-evidencing.
  echo '.libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths()))' >> "${R_HOME}/etc/Rprofile.site"
  Rscript -e 'cat("Library paths:\n"); print(.libPaths())'

.apt-pandoc: &apt-pandoc |
  apt-get update -qq
  apt-get install -y --no-install-recommends pandoc git ca-certificates
  rm -rf /var/lib/apt/lists/*

.install-pak: &install-pak |
  Rscript -e 'if (!requireNamespace("pak", quietly = TRUE)) install.packages("pak")'

# ---- stage: verify -----------------------------------------------------------

# `gates` folds six formerly-separate verify-stage jobs -- lint, readme, docs,
# citation-version, vendor-fidelity:yandex, vendor-fidelity:bing -- into one
# (SEOR-pgammbgo). robotstxtr measured as one of the three worst repos in the
# fleet's CI survey: ~10 jobs, ~7.5 minutes of actual compute, against a very
# large wall time driven almost entirely by ~2 minutes of pure runner-pickup
# tax PER JOB. Measured on a real main pipeline (#2875793448, all `success`):
#   lint 35.9s + readme 43.1s + docs 37.0s + citation-version 5.1s +
#   vendor-fidelity:yandex 4.4s + vendor-fidelity:bing 8.3s = ~133.8s combined.
# That is genuinely cheap; six separate pickups to run ~2m14s of work was the
# actual waste, not the work itself. `check`, `coverage`, and `pages` are
# deliberately left separate -- different concerns, different failure
# meanings, and (for `check`/`coverage`) genuinely not cheap.
#
# THE FOLD IS NOT FAIL-FAST. dev/gates.R runs every one of the six gates'
# commands (never stopping at the first failure), captures every exit status,
# prints ONE final summary naming every gate's verdict, and only THEN exits
# nonzero if any failed -- see the header of that script for the full
# rationale and command-by-command inventory (also reproduced in the commit
# that introduced this job). Folding red/green signals into one job without
# that property would trade six independent signals for one and still cost a
# re-run to find the second failure, which defeats the point of folding.
#
# vendor-fidelity:yandex and vendor-fidelity:bing fold in because, despite the
# name, NEITHER makes a network call: both are base-R/jsonlite comparisons of
# the real vendored source tree against a frozen MANIFEST.dcf checked into
# inst/vendor/* (see dev/gates.R's header for the grep that established this).
# A job that actually called out to a live vendor spec would have been left
# separate on purpose -- folding a network-dependent check into the fast gate
# would make the whole gate flaky on a vendor outage.
#
# citation-version previously ran in `image: python:3.13-alpine`, not the
# `rocker/r-ver` default the other five jobs use -- rocker/r-ver ships no
# python3 at all (verified: `docker run --rm rocker/r-ver:4.5.1 which python3`
# exits 1). The explicit `apt-get install -y --no-install-recommends python3`
# below exists ONLY for this job's sake; scripts/check-citation.py is
# stdlib-only, so nothing else is needed.
#
# Package installs below are the union of what the six original jobs
# installed (lintr; devtools; brio/cli/decor/desc/glue/tibble/vctrs +
# roxygen2 pinned to Config/roxygen2/version; jsonlite), plus RURL_GIT and
# deps::. that every one of them needed.
gates:
  stage: verify
  before_script:
    - *r-binaries
    - *apt-pandoc
    - apt-get update -qq && apt-get install -y --no-install-recommends python3 && rm -rf /var/lib/apt/lists/*
    - *install-pak
    - Rscript -e 'pak::pkg_install(c(Sys.getenv("RURL_GIT"), "deps::.", "lintr", "devtools", "brio", "cli", "decor", "desc", "glue", "tibble", "vctrs", "jsonlite"))'
    # Same reasoning as the old `docs` job: pinned so an unpinned roxygen2
    # release cannot turn into drift on a tree nobody touched.
    - Rscript -e 'pak::pkg_install(paste0("roxygen2@", read.dcf("DESCRIPTION", "Config/roxygen2/version")[[1]]))'
  script:
    - Rscript dev/gates.R

# ---- stage: check ------------------------------------------------------------

check:
  stage: check
  needs: ["gates"]
  before_script:
    - *r-binaries
    - *apt-pandoc
    - *install-pak
    # `deps::.` installs HARD dependencies only. --as-cran builds the knitr
    # vignette and runs the testthat suite, and knitr/rmarkdown/testthat all
    # live in Suggests, so the package's soft dependencies are installed
    # separately below. rurl goes first: CRAN serves 1.2.0, under the declared
    # floor, so the local solve has to find it already present from git.
    # Scoped to the local package on purpose -- a blanket `dependencies = TRUE`
    # on this vector would also pull rurl's own Suggests, pkgdown included.
    - Rscript -e 'pak::pkg_install(c(Sys.getenv("RURL_GIT"), "rcmdcheck"))'
    - Rscript -e 'pak::local_install_deps(dependencies = TRUE, upgrade = FALSE)'
  script:
    # Strict CRAN-grade pass on the fast gate, warnings fatal. The
    # cross-platform matrix repeats this on Windows and the self-hosted macOS
    # runner in the manually triggered pipeline.
    - |
      Rscript -e '
        res <- rcmdcheck::rcmdcheck(
          args = c("--no-manual", "--as-cran"),
          build_args = "--no-manual",
          error_on = "warning"
        )
      '
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - "*.Rcheck/"

# ---- stage: report -----------------------------------------------------------

coverage:
  stage: report
  needs: ["check"]
  before_script:
    - *r-binaries
    - *apt-pandoc
    - *install-pak
    # Same Suggests problem as `check`: covr runs the testthat suite, which
    # needs testthat, httpuv, jsonlite, callr, oysteR and rosv -- all Suggests.
    - Rscript -e 'pak::pkg_install(c(Sys.getenv("RURL_GIT"), "covr", "xml2"))'
    - Rscript -e 'pak::local_install_deps(dependencies = TRUE, upgrade = FALSE)'
  script:
    # covr's coverage percentage only reaches the log if the object is
    # printed; passing it straight to to_cobertura() would leave the
    # `coverage:` regex below with nothing to match.
    - |
      Rscript -e '
        cov <- covr::package_coverage(quiet = FALSE)
        print(cov)
        covr::to_cobertura(cov)
      '
  coverage: '/Coverage: \d+\.\d+\%/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cobertura.xml

# ---- stage: deploy -----------------------------------------------------------

# The pkgdown site. Ported from .github/workflows/pkgdown.yaml, which targeted
# the suspended GitHub account and last ran 2026-08-07 (ROBO-qqwkldzv), and
# modelled on the sibling pagerankr's `pages` job.
#
# `pkgdown::build_site()` writes to docs/, which is both .gitignored and
# .Rbuildignored here, so the site is a pure build artifact; GitLab Pages
# publishes `public/`, hence the move.
#
# robotstxtr itself must be INSTALLED, not merely loaded: build_reference()
# EVALUATES the examples, and those call library(robotstxtr). Building with
# install = FALSE and no installed copy dies at the first example with "there is
# no package called 'robotstxtr'". The GitHub workflow got this for free from
# r-lib/actions' `extra-packages: local::.`; on GitLab it has to be explicit --
# and here that install also compiles the vendored C++ matcher, so it is the
# expensive step of this job.
#
# local_install_deps(dependencies = TRUE) rather than `deps::.`: the vignettes
# and examples pkgdown renders reach into Suggests (knitr, rmarkdown, httpuv,
# jsonlite, callr), exactly as the `check` job does. rurl goes in first from its
# pinned git tag for the same reason as everywhere else in this file.
#
# pkgdown:::package_mds() renders every top-level .md except a hardcoded skip
# list (README.md/LICENSE(.md|CE.md)/NEWS.md, handled elsewhere) and a
# hardcoded no_render list (cran-comments.md, issue/PR templates); _pkgdown.yml
# has no setting that can add to either, so AGENTS.md, CLAUDE.md, FP_AGENTS.md
# and FP_CLAUDE.md were being published as pages -- and folded into
# search.json, where their text outranks real docs -- once the site went
# public (SEOR-pibdjanz).
#
# This used to be a 4-name deny list (`rm -f AGENTS.md CLAUDE.md FP_AGENTS.md
# FP_CLAUDE.md`), which is fail-OPEN: it does not cover a new name inside
# those families, let alone a new family such as GEMINI.md, and a future
# agent tool's instruction file would be published by default (SEOR-wqxhftpv).
# Inverted to a keep-list below: every top-level *.md is moved out UNLESS it
# is explicitly meant for the site, so an unknown file stays private by
# default. Moved rather than deleted (the `mv` shape, adopted from pslr's
# equivalent job) so a later reader of search.json never finds a link to a
# page that 404s. Fails loud, not silently, if a known agent file is somehow
# still in the root afterwards -- a rename or a keep-list mistake must break
# the pipeline, not quietly start publishing the file again.
.pkgdown-site:
  stage: deploy
  needs:
    - job: check
      artifacts: false
  before_script:
    - *r-binaries
    - *apt-pandoc
    - *install-pak
    - Rscript -e 'pak::pkg_install(c(Sys.getenv("RURL_GIT"), "pkgdown"))'
    - Rscript -e 'pak::local_install_deps(dependencies = TRUE, upgrade = FALSE)'
    - Rscript -e 'pak::local_install(upgrade = FALSE)'
  script:
    - |
      set -e
      mkdir -p /tmp/agent-md
      keep="README.md NEWS.md LICENSE.md LICENCE.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md THIRD_PARTY_NOTICES.md cran-comments.md CHANGELOG.md"
      for f in *.md; do
        case " $keep " in
          *" $f "*) continue ;;
        esac
        mv "$f" /tmp/agent-md/
      done
      for sensitive in AGENTS.md CLAUDE.md FP_AGENTS.md FP_CLAUDE.md; do
        if [ -f "$sensitive" ]; then
          echo "ERROR: $sensitive is still present after the agent-md filter; refusing to build the public site." >&2
          exit 1
        fi
      done
    - Rscript -e 'pkgdown::build_site(new_process = FALSE, install = FALSE)'
    - mv docs public
  artifacts:
    paths:
      - public

# Must be named `pages` and publish `public/` -- that pairing is what GitLab
# Pages deploys, not a convention this file chose.
#
# Default branch only: a site rebuilt from every merge request would publish
# unreviewed docs to the same URL, and this namespace bills 400 compute minutes
# a month.
pages:
  extends: .pkgdown-site
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# `pkgdown-preview` (extended .pkgdown-site, rules: merge_request_event only,
# manual, allow_failure) was removed under SEOR-bmgkzhvy: MR pipelines are
# suppressed fleet-wide (see `workflow:` above), so its one rule could never
# match again -- dead config that would have rotted silently. It existed so a
# merge request touching the site could prove a changed pkgdown recipe before
# it reached main; that capability is gone on purpose. The first run of a
# changed recipe is now on `main`, via `pages` itself.
