header:
  schema-version: 2.2.0
  last-updated: '2026-09-11'
  last-reviewed: '2026-09-11'
  url: https://gitlab.com/bart-turczynski/robotstxtr/-/raw/main/SECURITY-INSIGHTS.yml
  comment: |
    OpenSSF Security Insights self-report for robotstxtr, an R package that
    evaluates robots.txt crawl policy using a vendored snapshot of Google's
    open-source C++ robots.txt matcher. Maintained alongside SECURITY.md
    (human-readable policy).

project:
  name: robotstxtr
  homepage: https://robotstxtr-de6c15.gitlab.io
  administrators:
    - name: Bart Turczynski
      email: bartek@turczynski.pl
      social: https://orcid.org/0000-0002-8788-7980
      primary: true
  documentation:
    quickstart-guide: https://robotstxtr-de6c15.gitlab.io
    detailed-guide: https://robotstxtr-de6c15.gitlab.io/reference/index.html
    release-process: https://gitlab.com/bart-turczynski/robotstxtr/-/blob/main/CONTRIBUTING.md
  repositories:
    - name: robotstxtr
      url: https://gitlab.com/bart-turczynski/robotstxtr
      comment: |
        Sole repository for the robotstxtr package. The URL-matching engine is a
        vendored, upstream-test-validated snapshot of Google's open-source C++
        robots.txt matcher (Apache-2.0); fetch origins are constructed with the
        sibling rurl package.
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    contact:
      name: Bart Turczynski
      email: bartek@turczynski.pl
      primary: true
    policy: https://gitlab.com/bart-turczynski/robotstxtr/-/blob/main/SECURITY.md
    in-scope:
      - Unsafe handling of untrusted robots.txt bodies or URLs passed to the
        parsing, matching, and validation functions.
      - Memory-safety defects in the vendored C++ matcher as compiled and
        exercised through this package's bindings.
    out-of-scope:
      - Vulnerabilities in dependencies (httr2, rurl); report those upstream.
    comment: |
      Please do not report vulnerabilities in a public issue or merge request.
      This project is hosted on GitLab, which has no equivalent of GitHub's
      private vulnerability reporting form. Use one of these two channels
      instead:

      1. Open a CONFIDENTIAL issue on the project (New issue -> tick "This
         issue is confidential"). A confidential issue is visible only to
         project members with at least the Reporter role, so the report stays
         private while it is triaged in the tracker.
      2. Or email the maintainer at bartek@turczynski.pl, which is the route to
         use if you cannot sign in to GitLab.

      Acknowledgment is targeted within 7 days. robotstxtr performs robots.txt
      fetches under a deterministic, conservative httr2 policy and handles no
      credentials; all network access in tests, examples, and vignettes is
      mocked or served locally.

repository:
  url: https://gitlab.com/bart-turczynski/robotstxtr
  status: active
  bug-fixes-only: false
  accepts-change-request: true
  accepts-automated-change-request: false
  no-third-party-packages: false
  core-team:
    - name: Bart Turczynski
      email: bartek@turczynski.pl
      social: https://orcid.org/0000-0002-8788-7980
      primary: true
  documentation:
    contributing-guide: https://gitlab.com/bart-turczynski/robotstxtr/-/blob/main/CONTRIBUTING.md
    security-policy: https://gitlab.com/bart-turczynski/robotstxtr/-/blob/main/SECURITY.md
  license:
    url: https://gitlab.com/bart-turczynski/robotstxtr/-/blob/main/LICENSE
    expression: MIT
  release:
    changelog: https://gitlab.com/bart-turczynski/robotstxtr/-/blob/main/NEWS.md
    automated-pipeline: false
    distribution-points:
      - uri: https://gitlab.com/bart-turczynski/robotstxtr/-/releases
        comment: Tagged GitLab releases.
  security:
    tools:
      - name: rosv (OSV)
        type: SCA
        rulesets:
          - default
        integration:
          adhoc: true
          ci: true
          release: false
        results: {}
        comment: |
          Audit of the runtime dependency closure against the OSV database
          (osv.dev). No account or secrets required. Runs from the package's own
          test suite (tests/testthat/test-security.R), which the `check` job in
          .gitlab-ci.yml exercises on every push to main (merge-request
          pipelines are suppressed fleet-wide; see .gitlab-ci.yml's
          `workflow:` block).
      - name: oysteR (Sonatype OSS Index)
        type: SCA
        rulesets:
          - default
        integration:
          adhoc: true
          ci: true
          release: false
        results: {}
        comment: |
          Audit of the declared hard dependencies (Depends + Imports) against
          the Sonatype OSS Index, with allow-listed advisories carrying a written
          reason and a review date. Runs from the package's own test suite
          (tests/testthat/test-security.R), which the `check` job in
          .gitlab-ci.yml exercises on every push to main (merge-request
          pipelines are suppressed fleet-wide; see .gitlab-ci.yml's
          `workflow:` block).
      - name: AddressSanitizer / valgrind
        type: SAST
        rulesets:
          - default
        integration:
          adhoc: true
          ci: true
          release: false
        results: {}
        comment: |
          ASAN/UBSAN and valgrind runs over the vendored C++ matcher and its
          bindings. Not part of the fast gate in .gitlab-ci.yml: they live in a
          separate, manually triggered pipeline because this namespace has a 400
          compute-minute monthly budget (ROBO-mkuskipr).
