# Overrides the shared config's `verify` hook. The build/check runs against a
# clean `git archive HEAD` export (see dev/verify.sh) rather than the working
# tree, so a live browser socket under _scratch/ can no longer break R CMD
# build's copy step and block the push.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5120']
      # Vendored third-party payloads under src/vendor/ must stay byte-for-byte
      # identical to their pinned upstream (SHA-256 checked against the vendor
      # manifest), so the whitespace-rewriting hooks must never touch them. The
      # Yandex conformance corpus under inst/yandex-corpus/ is likewise a
      # byte-exact fixture (bodies carry deliberate trailing spaces, CRLF and
      # missing final newlines; cases.json is canonically serialized), so it is
      # excluded for the same reason. testthat snapshots under
      # tests/testthat/_snaps/ are the third case: testthat owns those files
      # byte-for-byte and rewrites them on every run, so a whitespace hook that
      # strips the trailing newline just loses a race with the next test run --
      # leaving the tree perpetually dirty and the snapshot perpetually
      # reformatted. Snapshot output can also carry meaningful trailing spaces
      # from column padding.
      - id: end-of-file-fixer
        exclude: ^(src/vendor/|inst/yandex-corpus/|tests/testthat/_snaps/)
      - id: trailing-whitespace
        exclude: ^(src/vendor/|inst/yandex-corpus/|tests/testthat/_snaps/)
      - id: check-merge-conflict
      - id: check-yaml
      - id: mixed-line-ending
        exclude: ^(src/vendor/|inst/yandex-corpus/|tests/testthat/_snaps/)
      - id: check-case-conflict
  # The spelling gate (dev/gates.R) reads DESCRIPTION, roxygen, vignettes,
  # README and NEWS, but not code, comments, string literals or tooling. This
  # covers those for British spellings. Skipped: generated man/, the tracker
  # snapshot, the byte-pinned conformance corpora, and vendored upstream code
  # (src/vendor/, and the four Google matcher files inst/PROVENANCE lists).
  # SEOR-xtmnpmae.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: codespell (British spellings, en-GB_to_en-US; SEOR-xtmnpmae)
        args: [--builtin, en-GB_to_en-US]
        stages: [pre-commit, pre-push]
        # The last three lines (four files) are temporary:
        # remove once ROBO-zexhmhic respells their fail() messages
        exclude: |
          (?x)^(
            man/|
            design/tracker-snapshot\.md$|
            inst/(bing|yandex)-corpus/|
            src/vendor/|
            src/(reporting_)?robots\.(cc|h)$|
            R/(bing|yandex)-corpus\.R$|
            tests/testthat/test-bing-corpus-onwulhga\.R$|
            tests/testthat/test-yandex-corpus-novczgii\.R$
          )
  - repo: local
    hooks:
      # Toolchain drift makes the gate red on a tree nobody changed, and it
      # arrives disguised as a code defect: a roxygen2 skew aborts the docs
      # guard, and a package built under a newer R than this one surfaces as an
      # R CMD check WARNING minutes into the expensive step below. This is
      # quick (one request, for CRAN's package index, which the check for a
      # dependency older than CRAN's reads: SEOR-hxxxkmws), and it runs ahead
      # of that step so the machine is
      # named as the cause in one line rather than found by elimination
      # (SEOR-tcytizic).
      - id: check-toolchain
        name: toolchain matches what this package pins
        entry: Rscript scripts/check-toolchain.R
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # NEWS heading and codemeta.json vs DESCRIPTION (ROBO-srowxxtg), and
      # spelling against inst/WORDLIST. The same gates the CI `gates` job runs;
      # in-process and a few seconds, so they run ahead of the expensive verify
      # step.
      - id: gates-metadata
        name: NEWS heading, codemeta.json and spelling
        entry: Rscript dev/gates.R news-version codemeta spelling
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # Fetches every URL the package declares (DESCRIPTION, man/,
      # inst/CITATION, NEWS, README.md) and fails on a dead one: --as-cran in
      # `verify` reports a dead link only as a NOTE, which the gate lets
      # through. A URL that cannot be reached at all only warns, so a network
      # blip never rejects a push; zero URLs checked fails; the only exemption
      # is BugReports' /-/issues URL answering exactly 404 (SEOR-ocbtrrnl).
      # The fleet standard's URL check, ported from sitemapr's `urls` stage
      # by way of punycoder's scripts/check-urls.R.
      - id: check-urls
        name: declared URLs resolve
        entry: Rscript scripts/check-urls.R
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: verify
        name: verify (mirrors CI)
        entry: dev/verify.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        verbose: true
      - id: check-citation
        name: citation metadata vs DESCRIPTION
        entry: python3 scripts/check-citation.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # DESCRIPTION's BugReports: keeps the CRAN-incoming-safe /-/issues form
      # while every human-facing file points at /-/work_items (SEOR-ocbtrrnl).
      # Stdlib Python and offline, wired the same way as check-citation.
      - id: check-bugreports
        name: BugReports split (DESCRIPTION vs human-facing links)
        entry: python3 scripts/check-bugreports.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
