# The hygiene hooks, at commit and at push. Install with `pre-commit install`
# (both hook types, from default_install_hook_types below), then
# `.fleet-ci/pre-push --install`, which replaces pre-commit's pre-push hook
# with fleet-ci's: that hook runs the fleet-ci local gate (.fleet-ci/gate,
# settings in .fleet-ci.yml) on each pushed ref, then this file's pre-push
# stage. The gate itself (spelling, the NEWS heading, codemeta, docs drift,
# lintr, README drift, the two vendored-tree fidelity checks, the URL check,
# R CMD check and the case-folding locale leg) is in .fleet-ci.yml, never
# here: this file must not run .fleet-ci/gate (fleet-ci README, "The local
# gate"). It replaces the former `verify` hook (dev/verify.sh) and the
# `gates-metadata` and `check-urls` hooks.
#
# Over fleet-ci's hook, `pre-commit install` and
# `pre-commit install --hook-type pre-push` without -f move it to
# hooks/pre-push.legacy (pre-commit's migration mode), which still runs the
# gate first. `pre-commit install -f` (both types, from
# default_install_hook_types) and `pre-commit install -f --hook-type pre-push`
# delete it and drop the gate; `-f --hook-type pre-commit` leaves it alone.
# Re-run `.fleet-ci/pre-push --install` after either of the two.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5120']
      # Vendored third-party payloads under src/vendor/ must stay byte-for-byte
      # identical to their pinned upstream (SHA-256 checked against the vendor
      # manifest), so the whitespace-rewriting hooks must never touch them. The
      # Yandex conformance corpus under inst/yandex-corpus/ is likewise a
      # byte-exact fixture (bodies carry deliberate trailing spaces, CRLF and
      # missing final newlines; cases.json is canonically serialized), so it is
      # excluded for the same reason. testthat snapshots under
      # tests/testthat/_snaps/ are the third case: testthat owns those files
      # byte-for-byte and rewrites them on every run, so a whitespace hook that
      # strips the trailing newline just loses a race with the next test run --
      # leaving the tree perpetually dirty and the snapshot perpetually
      # reformatted. Snapshot output can also carry meaningful trailing spaces
      # from column padding.
      #
      # .fleet-ci/ is fleet-ci's bin/vendor output, which seor's fleet checker
      # requires byte for byte; re-run bin/vendor rather than editing it.
      - id: end-of-file-fixer
        exclude: &fixer-excludes '^(\.fleet-ci/|src/vendor/|inst/yandex-corpus/|tests/testthat/_snaps/)'
      - id: trailing-whitespace
        exclude: *fixer-excludes
      - id: check-merge-conflict
      - id: check-yaml
      - id: mixed-line-ending
        exclude: *fixer-excludes
      - id: check-case-conflict
  # The spelling gate (.fleet-ci.yml's docs_gates) reads DESCRIPTION, roxygen,
  # vignettes, README and NEWS, but not code, comments, string literals or
  # tooling. This covers those for British spellings. Skipped: fleet-ci's
  # vendored gate (.fleet-ci/), generated man/, the tracker snapshot, the
  # byte-pinned conformance corpora, and vendored upstream code (src/vendor/,
  # and the four Google matcher files inst/PROVENANCE lists). SEOR-xtmnpmae.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: codespell (British spellings, en-GB_to_en-US; SEOR-xtmnpmae)
        args: [--builtin, en-GB_to_en-US]
        stages: [pre-commit, pre-push]
        # The last three lines (four files) are temporary:
        # remove once ROBO-zexhmhic respells their fail() messages
        exclude: |
          (?x)^(
            \.fleet-ci/|
            man/|
            design/tracker-snapshot\.md$|
            inst/(bing|yandex)-corpus/|
            src/vendor/|
            src/(reporting_)?robots\.(cc|h)$|
            R/(bing|yandex)-corpus\.R$|
            tests/testthat/test-bing-corpus-onwulhga\.R$|
            tests/testthat/test-yandex-corpus-novczgii\.R$
          )
  - repo: local
    hooks:
      # Warns, loudly, when this clone's pre-push hook is not fleet-ci's, so
      # the push ran without the gate. Warn-only by decision, time-boxed until
      # the hook is installed fleet-wide, then it fails. It only reads the
      # hook file; it never runs .fleet-ci/gate.
      - id: fleet-ci-hook-installed
        name: fleet-ci pre-push hook is installed (warn-only)
        entry: sh scripts/check-fleet-hook.sh
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-push]
      # This machine's R toolchain against what the package pins: roxygen2
      # against Config/roxygen2/version, installed packages built under a newer
      # R, and the local pandoc against the fleet image's (.fleet-ci/toolchain),
      # so a local devtools::document() or README knit writes what the gate
      # accepts. The gate itself runs in the fleet image and does not depend
      # on this machine's library. Quick: one request, for CRAN's package
      # index (SEOR-hxxxkmws, SEOR-tcytizic).
      - id: check-toolchain
        name: toolchain matches what this package pins
        entry: Rscript scripts/check-toolchain.R
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # CITATION.cff `version:` and .zenodo.json `"version"` name the release
      # DESCRIPTION's Version names, and every URL they declare is in
      # DESCRIPTION's URL: field (seor design/adr/0001). It runs on every push,
      # whatever the gate's tier; T2's citation-version job runs it again. Its
      # self-test, which the former citation-version job ran on every push to
      # main, runs when the script changes.
      - id: check-citation
        name: citation metadata vs DESCRIPTION
        entry: python3 scripts/check-citation.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: check-citation-self-test
        name: check-citation self-test
        entry: python3 scripts/check-citation.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/check-citation\.py$
        stages: [pre-push]
      # DESCRIPTION's BugReports: and every tracker link (codemeta.json,
      # .bestpractices.json, CONTRIBUTING.md, SECURITY.md) name /-/work_items,
      # and no human-facing file may carry a /-/issues link (seor ADR 0011,
      # https://gitlab.com/bart-turczynski/seor/-/blob/main/design/adr/0011-bugreports-names-work-items.md).
      # It reads _pkgdown.yml too, so it runs on every push, whatever the
      # gate's tier. Stdlib Python and offline. Its self-test runs when the
      # script changes.
      - id: check-bugreports
        name: BugReports and tracker links name /-/work_items
        entry: python3 scripts/check-bugreports.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: check-bugreports-self-test
        name: check-bugreports self-test
        entry: python3 scripts/check-bugreports.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/check-bugreports\.py$
        stages: [pre-push]
      # NEWS.md bullets are one terse line: check-news.py refuses a bullet
      # that wraps, runs past its word limit or names only housekeeping, and
      # any Internal heading (seor design/fleet-standard.md, "NEWS.md
      # bullets"; SEOR-mjrpwnqz). Ported byte for byte from seor; stdlib
      # Python and offline, wired the same way as check-citation. Its
      # self-test runs when the script changes.
      - id: news-terse
        name: NEWS.md bullets are one terse line
        entry: python3 scripts/check-news.py NEWS.md
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: news-terse-self-test
        name: check-news self-test
        entry: python3 scripts/check-news.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/check-news\.py$
        stages: [pre-push]
